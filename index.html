<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkyFetch Weather Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================= -->
    <!-- Header Section -->
    <!-- ========================= -->
    <header>
        <h1>🌤️ SkyFetch Weather Dashboard</h1>
        <p>Get current weather and 5-day forecast instantly</p>
    </header>

    <!-- ========================= -->
    <!-- Search Section -->
    <!-- ========================= -->
    <section class="search-section">
        <input 
            type="text" 
            id="cityInput" 
            placeholder="Enter city name"
            autocomplete="off"
        >
        <button id="searchBtn">Search</button>
    </section>

    <!-- ========================= -->
    <!-- Current Weather Section -->
    <!-- ========================= -->
    <section id="weatherContainer">
        <!-- Current weather will be injected here -->
    </section>

    <!-- ========================= -->
    <!-- 5-Day Forecast Section -->
    <!-- ========================= -->
    <section>
        <div id="forecastContainer" class="forecast-grid">
            <!-- Forecast cards will be injected here -->
        </div>
    </section>

    <!-- ========================= -->
    <!-- JavaScript File -->
    <!-- ========================= -->
    <script src="app.js"></script>

</body>
</html>
